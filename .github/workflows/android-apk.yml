name: Build Android APK (RuStore)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android versionCode (увеличивать +1 для каждого обновления в RuStore)'
        required: true
        default: '1'
      version_name:
        description: 'Android versionName (видимая версия, например 1.0.0)'
        required: true
        default: '1.0.0'
  push:
    branches:
      - main
      - 'arena/*'
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify JS syntax before packaging
        run: |
          node --check js/audio.js
          node --check js/world.js
          node --check js/game.js

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Determine version and signing mode
        id: meta
        env:
          KS_B64: ${{ secrets.RUSTORE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RUSTORE_KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.RUSTORE_KEY_ALIAS }}
          K_PASS: ${{ secrets.RUSTORE_KEY_PASSWORD }}
        run: |
          VC="${{ github.event.inputs.version_code }}"
          VN="${{ github.event.inputs.version_name }}"
          if [ -z "$VC" ]; then VC="1"; fi
          if [ -z "$VN" ]; then
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              VN="${GITHUB_REF_NAME#v}"
            else
              VN="1.0.0"
            fi
          fi
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"

          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$K_ALIAS" ] && [ -n "$K_PASS" ]; then
            echo "$KS_B64" | base64 --decode > /tmp/rustore-release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Build mode: SIGNED RELEASE (v$VN, code $VC)"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Build mode: DEBUG TEST APK (add RUSTORE_KEYSTORE_* secrets for signed RuStore release)"
          fi

      - name: Build Signed Release APK & AAB (for RuStore)
        if: steps.meta.outputs.signed == 'true'
        working-directory: android
        env:
          KEYSTORE_FILE: /tmp/rustore-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RUSTORE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RUSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RUSTORE_KEY_PASSWORD }}
        run: |
          gradle assembleRelease bundleRelease \
            -PversionCode=${{ steps.meta.outputs.version_code }} \
            -PversionName=${{ steps.meta.outputs.version_name }} \
            --no-daemon
          ls -lh app/build/outputs/apk/release/ app/build/outputs/bundle/release/

      - name: Build Debug Test APK (no signing secrets configured yet)
        if: steps.meta.outputs.signed != 'true'
        working-directory: android
        run: |
          gradle assembleDebug \
            -PversionCode=${{ steps.meta.outputs.version_code }} \
            -PversionName=${{ steps.meta.outputs.version_name }} \
            --no-daemon
          ls -lh app/build/outputs/apk/debug/

      - name: Upload Signed Release APK (RuStore)
        if: steps.meta.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vault-runner-v${{ steps.meta.outputs.version_name }}-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Signed Release AAB (optional)
        if: steps.meta.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vault-runner-v${{ steps.meta.outputs.version_name }}-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload Debug Test APK
        if: steps.meta.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vault-runner-v${{ steps.meta.outputs.version_name }}-debug-test-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish direct APK to GitHub Releases (1-tap download on phone)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VN: ${{ steps.meta.outputs.version_name }}
          VC: ${{ steps.meta.outputs.version_code }}
          SIGNED: ${{ steps.meta.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            TAG="v${VN}"
            cp android/app/build/outputs/apk/release/*.apk "vault-runner-v${VN}-release.apk"
            cp android/app/build/outputs/bundle/release/*.aab "vault-runner-v${VN}-release.aab"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "vault-runner-v${VN}-release.apk" "vault-runner-v${VN}-release.aab" --clobber
            else
              gh release create "$TAG" "vault-runner-v${VN}-release.apk" "vault-runner-v${VN}-release.aab" \
                --target "${{ github.sha }}" \
                --title "VAULT RUNNER v${VN} (RuStore Release)" \
                --notes "Подписанная релизная сборка v${VN} (versionCode ${VC}) для загрузки в RuStore."
            fi
          else
            TAG="test-apk"
            cp android/app/build/outputs/apk/debug/*.apk "vault-runner-test.apk"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "vault-runner-test.apk" --clobber
            else
              gh release create "$TAG" "vault-runner-test.apk" \
                --target "${{ github.sha }}" \
                --prerelease \
                --title "VAULT RUNNER (Тестовый APK для телефона)" \
                --notes "Тестовая debug-сборка v${VN} для установки на Android и съёмки скриншотов. Скачивайте файл vault-runner-test.apk напрямую."
            fi
          fi

      - name: Clean up temporary keystore
        if: always()
        run: rm -f /tmp/rustore-release.keystore
