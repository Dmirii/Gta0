<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA 0 Online</title>
<link rel="icon" href="favicon.svg">
<style>
body { margin: 0; background: #0c140c; overflow: hidden; font-family: system-ui, sans-serif; }
#game { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="game"></div>
<div id="gameLog" style="display:none; white-space:pre; font-size:12px; position:fixed; top:42px; left:12px; z-index:999; color:#ff4d4d; background:#0008; padding:4px;"></div>
<script>
  // отладка: если поле игры не видно — показать лог ошибок
  window.addEventListener('error', (e) => {
    const el = document.getElementById('gameLog');
    if (el) { el.style.display = ''; el.textContent += 'ERR: ' + e.message + ' @' + e.filename + ':' + e.lineno + '\n'; }
  });
  window.gameCanvas = () => document.querySelector('#game canvas');
</script>
<script src="vendor/phaser.min.js"></script>
<script src="js/game.js"></script>
</body>
</html>
