<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA 0 Online</title>
<link rel="icon" href="favicon.svg">
<style>
body { margin: 0; background: #0c140c; overflow: hidden; font-family: system-ui, sans-serif; }
#game { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="game"></div>
<div id="gameTest" style="position:fixed; left:12px; top:12px; z-index:9999; font:bold 32px sans-serif; color:#ff4d4d; text-shadow:1px 1px 3px #000;">v976d0cb</div>
<div id="gameLog" style="white-space:pre; font-size:12px; position:fixed; top:42px; left:12px; z-index:999; color:#ff4d4d; background:#0008; padding:4px;"></div>
<script>
  // отладка: если поле игры не видно — показать лог ошибок
  window.addEventListener('error', (e) => {
    const el = document.getElementById('gameLog');
    if (el) { el.style.display = ''; el.textContent += 'ERR: ' + e.message + ' @' + e.filename + ':' + e.lineno + '\n'; }
  });
  window.gameCanvas = () => document.querySelector('#game canvas');
  window.addEventListener('DOMContentLoaded', () => {
    const el = document.getElementById('debugInfo');
    if (!el) return;
    function rectInfo(c) {
      if (!c) return 'canvas: none';
      const r = c.getBoundingClientRect();
      return 'canvas x=' + Math.round(r.x) + ' y=' + Math.round(r.y) + ' w=' + Math.round(r.width) + ' h=' + Math.round(r.height) + ' parent=' + (c.parentElement ? (c.parentElement.id || c.parentElement.tagName) : 'none');
    }
    function upd() {
      const canvases = document.querySelectorAll('canvas');
      const c = canvases[0];
      el.textContent = [
        'canvases: ' + canvases.length,
        rectInfo(c),
        'gameStatus: ' + (window.gameStatus || '?'),
        '#game html: ' + (document.querySelector('#game') ? document.querySelector('#game').innerHTML.slice(0, 120) : '?'),
        'body h: ' + document.body.scrollHeight
      ].join(' | ');
    }
    setInterval(upd, 900); setTimeout(upd, 200);
  });
</script>
<script src="vendor/phaser.min.js"></script>
<script src="js/game.js"></script>
</body>
</html>
